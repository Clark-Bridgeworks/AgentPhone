[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentphone"
version = "0.4.7"
description = "Local communication bridge for independent agents and native desktop sessions"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Clark-Bridgeworks"}]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
demo = ["httpx>=0.27,<1"]

desktop = ["mcp>=2.2,<3", "psutil>=7,<8"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
agentphone = "agentphone.main:main"
agentphone-desktop = "agentphone.desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentphone = ["web/*.html", "desktop/*.html", "desktop/*.ico", "desktop/*.png", "desktop/*.svg", "desktop/native/*.exe", "desktop/native/*.cs", "desktop/native/workbuddy-bridge/*.json", "desktop/native/workbuddy-bridge/server/*.cjs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
